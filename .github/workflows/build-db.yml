name: Build Transit Database

on:
  workflow_dispatch:
    inputs:
      data_path:
        description: "Path to raw data directory (relative to repo or local)"
        required: false
        default: "data"
      create_release:
        description: "Create or update GitHub Release asset (true/false)"
        required: false
        default: "true"
      release_tag:
        description: "Release tag (leave empty for vYYYY.MM.DD)"
        required: false
        default: ""

  push:
    branches:
      - main
    paths:
      - "cases_metadata.csv"
      - "_case_template/**"
      - "build_db.py"
      - "check_coverage.py"
      - "requirements.txt"
      - "data/**"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build & Verify Database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Locate and prepare source data
        id: prepare_data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SPECIFIED_PATH="${{ github.event.inputs.data_path || 'data' }}"

          # 1. Check if specified or default directory exists
          if [ -d "$SPECIFIED_PATH" ]; then
            echo "Found data directory at: $SPECIFIED_PATH"
            echo "data_dir=$SPECIFIED_PATH" >> $GITHUB_OUTPUT
            echo "data_exists=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 2. Check if data.zip exists in repo
          if [ -f "data.zip" ]; then
            echo "Found local data.zip. Extracting..."
            unzip -q data.zip
            echo "data_dir=data" >> $GITHUB_OUTPUT
            echo "data_exists=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 3. Attempt to download data.zip from GitHub Release assets
          echo "Checking GitHub Releases for data.zip asset..."
          if gh release download --pattern "data.zip" 2>/dev/null; then
            echo "Downloaded data.zip from releases. Extracting..."
            unzip -q data.zip
            echo "data_dir=data" >> $GITHUB_OUTPUT
            echo "data_exists=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "::warning ::Source data folder or data.zip not found. Database rebuild skipped."
          echo "data_exists=false" >> $GITHUB_OUTPUT

      - name: Build SQLite database
        if: steps.prepare_data.outputs.data_exists == 'true'
        run: |
          DATA_DIR="${{ steps.prepare_data.outputs.data_dir }}"
          echo "Building transit.db from $DATA_DIR..."
          python build_db.py "$DATA_DIR" -o transit.db --force --export-docs docs/data

      - name: Validate database coverage & integrity
        if: steps.prepare_data.outputs.data_exists == 'true'
        run: |
          DATA_DIR="${{ steps.prepare_data.outputs.data_dir }}"
          python check_coverage.py transit.db "$DATA_DIR"

      - name: Upload build artifacts
        if: steps.prepare_data.outputs.data_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: transit-database
          path: |
            transit.db
            docs/data/transit_core.db
            docs/data/transit.db.gz
          retention-days: 14

      - name: Commit updated web viewer assets
        if: steps.prepare_data.outputs.data_exists == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if git diff --staged --quiet; then
            echo "No changes to web viewer database assets."
          else
            git commit -m "Auto-update web viewer database assets [skip ci]"
            git push
          fi

      - name: Publish GitHub Release asset
        if: ${{ steps.prepare_data.outputs.data_exists == 'true' && (github.event.inputs.create_release == 'true' || github.event_name == 'push') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="v$(date +'%Y.%m.%d')"
          fi

          echo "Publishing release with tag: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading/overwriting assets..."
            gh release upload "$TAG" transit.db docs/data/transit.db.gz --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" transit.db docs/data/transit.db.gz \
              --title "Transit Database $TAG" \
              --notes "Automated database build from commit ${{ github.sha }}."
          fi
