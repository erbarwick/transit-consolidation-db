name: Rebuild Transit Database

on:
  workflow_dispatch:
    inputs:
      data_path:
        description: "Path to raw data directory (relative to repo or local)"
        required: false
        default: "data"
      create_release:
        description: "Create/update GitHub Release asset (true/false)"
        required: false
        default: "false"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for source data directory
        id: check_data
        run: |
          if [ -d "${{ github.event.inputs.data_path || 'data' }}" ]; then
            echo "data_exists=true" >> $GITHUB_OUTPUT
          else
            echo "data_exists=false" >> $GITHUB_OUTPUT
            echo "Data directory not found in repository. Skipping build."
          fi

      - name: Build SQLite database
        if: steps.check_data.outputs.data_exists == 'true'
        run: |
          python build_db.py "${{ github.event.inputs.data_path || 'data' }}" -o transit.db --force --export-docs docs/data

      - name: Validate database coverage & integrity
        if: steps.check_data.outputs.data_exists == 'true'
        run: |
          python check_coverage.py transit.db "${{ github.event.inputs.data_path || 'data' }}"

      - name: Commit updated web viewer assets (transit_core.db)
        if: steps.check_data.outputs.data_exists == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if git diff --staged --quiet; then
            echo "No changes to web database."
          else
            git commit -m "Auto-update web database assets [skip ci]"
            git push
          fi

      - name: Update GitHub Release (if requested)
        if: ${{ steps.check_data.outputs.data_exists == 'true' && github.event.inputs.create_release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(date +'%Y.%m.%d')"
          gh release create "$tag" transit.db docs/data/transit.db.gz \
            --title "Transit Database $tag" \
            --notes "Automated database build."
